{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>Login</h1>
  <form method="post">
    <label>TUPM ID (student) or username (admin)</label>
    <input name="username" required autofocus style="width:100%">
    <label>Password</label>
    <input name="password" type="password" required style="width:100%">
    <p><button>Log in</button></p>
  </form>
  <p class="muted">Student, first time? <a href="/register">Register</a></p>
</div>
{% endblock %}
